<!-- Full updated HTML with photos added -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ReVeRs — монтаж электрики, сантехники и вентиляции. Портфолио работ и контактная информация." />
  <title>ReVeRs — Сантехника, Электрика, Вентиляция</title>
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      color: #fff;
      background: url('images/5.jpg') no-repeat center center fixed;
      background-size: cover;
      scroll-behavior: smooth;
    }
    header {
      background-color: rgba(0, 0, 0, 0.7);
      text-align: center;
      padding: 1.5rem;
    }
    header img {
      width: 150px;
      height: auto;
      margin-bottom: 0.5rem;
    }
    nav {
      position: sticky;
      top: 0;
      background-color: rgba(0, 0, 0, 0.8);
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      padding: 0.5rem 0;
      z-index: 1000;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      transition: background 0.3s ease;
    }
    nav a:hover {
      background-color: rgba(255, 255, 255, 0.2);
    }
    section {
      padding: 2rem 1rem;
      background-color: rgba(0, 0, 0, 0.6);
      margin: 2rem auto;
      max-width: 1200px;
      border-radius: 12px;
    }
    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    .gallery {
      display: grid;
      gap: 1.5rem;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }
    .item {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }
    .item:hover {
      transform: translateY(-5px);
    }
    .item img {
      width: 100%;
      border-radius: 8px;
      margin-bottom: 0.8rem;
    }
    .item p {
      font-size: 0.95rem;
    }
    footer {
      text-align: center;
      padding: 2rem 1rem;
      background: rgba(0, 0, 0, 0.7);
      color: #ccc;
      font-size: 0.9rem;
    }
    .contacts p {
      text-align: center;
      line-height: 1.8;
    }
    .social-icons {
      margin-top: 1rem;
      text-align: center;
    }
    .social-icons a {
      color: #fff;
      margin: 0 10px;
      font-size: 1.5rem;
      transition: color 0.3s ease;
    }
    .social-icons a:hover {
      color: #1da1f2;
    }
    iframe.map {
      width: 100%;
      height: 400px;
      border: 0;
      margin-top: 2rem;
      border-radius: 12px;
    }
    .form-box {
      margin-top: 2rem;
      text-align: center;
    }
    .form-box input, .form-box textarea {
      width: 90%;
      max-width: 500px;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 6px;
      border: none;
      font-size: 1rem;
    }
    .form-box button {
      padding: 0.8rem 2rem;
      border: none;
      background-color: #1da1f2;
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.3s ease;
    }
    .form-box button:hover {
      background-color: #148acc;
    }
  </style>
</head>
<body>
  <header>
    <img src="images/logo.png" alt="Логотип ReVeRs" />
    <h1>ReVeRs</h1>
    <p>Монтаж электрики, сантехники и вентиляции</p>
  </header>

  <nav>
    <a href="#santehnika">Сантехника</a>
    <a href="#elektrika">Электрика</a>
    <a href="#ventilyatsiya">Вентиляция</a>
    <a href="#contact">Контакты</a>
  </nav>
  <!-- Остальная часть уже присутствует в canvas -->
</body>
</html>
